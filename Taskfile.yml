version: '3'

vars:
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  build:
    desc: Build the shortener binary
    cmds:
      - go build ./cmd/shortener

  run:memory:
    desc: Run HTTP and gRPC servers with in-memory storage
    cmds:
      - go run ./cmd/shortener --database memory --port 8082 --grpc-port 9091

  run:postgres:
    desc: Run HTTP and gRPC servers with PostgreSQL storage
    cmds:
      - go run ./cmd/shortener --database postgres --port 8082 --grpc-port 9091 --env .env

  proto:tools:
    desc: Install protobuf Go generators
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}

  proto:
    desc: Generate Go bindings from protobuf definitions
    cmds:
      - >-
        protoc
        --go_out=. --go_opt=paths=source_relative
        --go-grpc_out=. --go-grpc_opt=paths=source_relative
        api/v1/grpc/url.proto

  docker:build:
    desc: Build the local Docker image
    cmds:
      - docker build -t url-shortener:local .

  docker:up:
    desc: Start the application and PostgreSQL with Docker Compose
    cmds:
      - docker compose up --build

  docker:db:
    desc: Start only PostgreSQL in the background
    cmds:
      - docker compose up db -d

  tidy:
    desc: Synchronize Go module dependencies
    cmds:
      - go mod tidy
